<!DOCTYPE html>
<html>
<head>
  <title>Schema Viewer test page</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      { "@type": "Organization", "@id": "https://example.com/#org", "name": "Example Co", "url": "https://example.com/" },
      { "@type": "WebSite", "name": "Example", "publisher": { "@id": "https://example.com/#org" } }
    ]
  }
  </script>
  <meta property="og:title" content="Hello from the test page">
  <meta property="og:description" content="A sample page for trying out the Schema Viewer DevTools panel.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Example">
  <meta property="og:image" content="https://placehold.co/1200x630.png">
  <meta property="article:published_time" content="2026-09-24T09:00:00Z">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="googlebot-news" content="noindex">
  <link rel="canonical" href="https://example.com/hello">
  <link rel="alternate" hreflang="en" href="https://example.com/hello">
  <link rel="alternate" hreflang="es" href="https://example.es/hola">
  <link rel="alternate" hreflang="x-default" href="https://example.com/hello">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@example">
  <script type="application/json" id="app-config">{ "feature": true, "count": 3 }</script>
</head>
<body>
  <h1>Test page</h1>
  <div itemscope itemtype="https://schema.org/Product" id="product">
    <h2 itemprop="name">Widget</h2>
    <img itemprop="image" src="https://placehold.co/200.png" alt="">
    <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
      <meta itemprop="priceCurrency" content="USD">
      $<span itemprop="price">19.99</span>
      <link itemprop="availability" href="https://schema.org/InStock">
    </div>
    <div itemprop="review" itemscope itemtype="https://schema.org/Review">
      <span itemprop="author">Sam</span> rated it <span itemprop="reviewRating" itemscope itemtype="https://schema.org/Rating"><span itemprop="ratingValue">4</span>/5</span>
    </div>
    <div itemprop="review" itemscope itemtype="https://schema.org/Review">
      <span itemprop="author">Alex</span>, <time itemprop="datePublished" datetime="2026-09-01">Sept 1</time>
    </div>
  </div>
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Article", "headline": "Hello", "author": { "@type": "Person", "name": "Jane" }, "datePublished": "2026-09-24" }
  </script>
  <script type="application/ld+json">{ "broken": true, }</script>
</body>
</html>
